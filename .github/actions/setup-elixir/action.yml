name: 'Setup Elixir Environment'
description: 'Install Elixir, OTP, and Mix dependencies with caching'

inputs:
  project-directory:
    description: 'Mix project directory to prepare'
    required: false
    default: '.'
  cache-plt:
    description: 'Restore the root Dialyzer PLT cache'
    required: false
    default: 'true'
  install-babashka:
    description: 'Restore or install the root Babashka tool'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Elixir
      id: setup-beam
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.2'
        otp-version: '29.0.3'

    - name: Cache deps and _build
      uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          ${{ inputs.project-directory }}/deps
          ${{ inputs.project-directory }}/_build
        key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ inputs.project-directory }}-env${{ env.MIX_ENV || 'dev' }}-otp${{ steps.setup-beam.outputs.otp-version }}-elixir${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles(format('{0}/mix.lock', inputs.project-directory)) }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-mix-${{ inputs.project-directory }}-env${{ env.MIX_ENV || 'dev' }}-otp${{ steps.setup-beam.outputs.otp-version }}-elixir${{ steps.setup-beam.outputs.elixir-version }}-

    - name: Get dependencies
      run: mix deps.get --check-locked
      working-directory: ${{ inputs.project-directory }}
      shell: bash

    # The bundled launcher is the only dependency carrying a native artifact,
    # and nothing in the Mix or make staleness chain ties that artifact to
    # `c_src`. A restored `_build` keeps the cached executable, and a rebuilt
    # one is downloaded from the release matching the launcher version. Either
    # way the root project can run against an executable older than the tree
    # it is testing, so drop the artifact and build this tree's source.
    - name: Rebuild the bundled native launcher from source
      if: inputs.project-directory == '.'
      env:
        PTC_RUNNER_LAUNCHER_BUILD_FROM_SOURCE: '1'
      run: |
        rm -rf "_build/${MIX_ENV:-dev}/lib/ptc_runner_launcher"
        mix deps.compile ptc_runner_launcher
      shell: bash

    - name: Cache Dialyzer PLT
      if: inputs.cache-plt == 'true'
      uses: actions/cache@v5
      with:
        path: priv/plts
        key: plt-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.setup-beam.outputs.otp-version }}-elixir${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          plt-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.setup-beam.outputs.otp-version }}-elixir${{ steps.setup-beam.outputs.elixir-version }}-

    - name: Cache Babashka
      if: inputs.install-babashka == 'true'
      uses: actions/cache@v5
      id: cache-babashka
      with:
        path: _build/tools
        key: babashka-${{ runner.os }}-${{ runner.arch }}-1.4.192-sha256-v1

    - name: Install Babashka
      if: inputs.install-babashka == 'true' && steps.cache-babashka.outputs.cache-hit != 'true'
      run: mix ptc.install_babashka --force
      shell: bash
