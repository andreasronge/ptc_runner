name: 'Setup Elixir Environment'
description: 'Install Elixir, OTP, and Mix dependencies with caching'

runs:
  using: 'composite'
  steps:
    - name: Set up Elixir
      id: setup-beam
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.2'
        otp-version: '29.0.3'

    - name: Cache deps and _build
      uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-otp29.0.3-elixir1.20.2-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-otp29.0.3-elixir1.20.2-

    - name: Get dependencies
      run: mix deps.get
      shell: bash

    - name: Cache Dialyzer PLT
      uses: actions/cache@v5
      with:
        path: priv/plts
        key: plt-${{ runner.os }}-otp29.0.3-elixir1.20.2-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          plt-${{ runner.os }}-otp29.0.3-elixir1.20.2-

    - name: Cache Babashka
      uses: actions/cache@v5
      id: cache-babashka
      with:
        path: _build/tools
        key: babashka-${{ runner.os }}-1.4.192-sha256-v1

    - name: Install Babashka
      if: steps.cache-babashka.outputs.cache-hit != 'true'
      run: mix ptc.install_babashka --force
      shell: bash
