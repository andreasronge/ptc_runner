name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      HEX_SPONSOR: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a main commit
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Release gates may be dispatched only from main."
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup-elixir
      - run: mix precommit
      - run: mix prepush
      - run: MIX_ENV=dev mix deps.get && MIX_ENV=dev mix docs --warnings-as-errors
      - run: MIX_ENV=prod mix hex.build
