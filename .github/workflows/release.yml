name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      HEX_SPONSOR: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-elixir
      - run: mix precommit
      - run: mix prepush
      - run: MIX_ENV=prod mix hex.build
