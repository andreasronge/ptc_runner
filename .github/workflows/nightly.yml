name: Nightly

# `:nightly` tests are excluded from `mix test` by default and are not a per-PR
# gate. Each one compiles a project, drives a real Mix subprocess, or waits on
# a multi-second deadline, so they cost seconds apiece and used to sit on the
# serial side of the PR suite.
#
# They still have to run, and daily is the right cadence. The downstream-consumer
# test is a genuine per-commit verdict, so a break should surface within a day of
# the commit that caused it rather than a week; the benchmark's signal is a trend
# and daily suits it too. Example `mix ptc run` walks and Mix-process CLI
# wrappers follow the same rule.
#
# Reserve `:nightly` for those operator-path Mix/OS cases. It is not a synonym
# for `:slow`, which only skips the fast pre-commit path -- see
# `test/test_helper.exs` for why conflating the two quietly dropped ten
# correctness tests from every PR. Do not nightly in-process CommandEngine,
# TraceLog lease, or pre-push classification tests.
#
# The interactive REPL PTY check belongs here too: it drives the packaged
# `ptc repl` through expect(1) with timed keystrokes, which is slow and
# load-sensitive, and GitHub Ubuntu does not ship expect. Per-PR
# `core-release` still verifies the package and the rest of the standalone
# smoke; it sets `PTC_SKIP_PTY_GATE`. Docker verify and the packaging script
# keep running the check without that skip.
#
# Like `soak.yml` this lives outside `test.yml` so it can be dispatched on its
# own and so a red run never blocks an unrelated pull request.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    name: Nightly tests
    # The downstream-consumer test builds a fresh project under MIX_ENV=prod
    # against PtcRunner as a path dependency, so it pays a full cold compile
    # whenever the cached `_build` misses.
    timeout-minutes: 30
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run the nightly test suite
        run: mix nightly

      - name: Check evaluator reduction baselines
        env:
          MIX_ENV: dev
        run: mix bench.check --skip-heap

  interactive-repl:
    runs-on: ubuntu-latest
    name: Interactive REPL
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      # The interactive REPL check drives the packaged command through a
      # pseudo-terminal, which no other gate can supply. macOS ships `expect`;
      # this image does not, and the check refuses to pass by skipping.
      - name: Install the pseudo-terminal driver
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends expect

      - name: Verify the packaged interactive REPL
        run: scripts/verify_standalone_release.sh
