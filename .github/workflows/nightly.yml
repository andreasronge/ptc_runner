name: Nightly

# `:nightly` tests are excluded from `mix test` by default and are not a per-PR
# gate. Each one compiles a project, drives a real Mix subprocess, or waits on
# a multi-second deadline, so they cost seconds apiece and used to sit on the
# serial side of the PR suite.
#
# They still have to run, and daily is the right cadence. The downstream-consumer
# test is a genuine per-commit verdict, so a break should surface within a day of
# the commit that caused it rather than a week; the benchmark's signal is a trend
# and daily suits it too. Example `mix ptc run` walks and Mix-process CLI
# wrappers follow the same rule.
#
# Reserve `:nightly` for those operator-path Mix/OS cases. It is not a synonym
# for `:slow`, which only skips the fast pre-commit path -- see
# `test/test_helper.exs` for why conflating the two quietly dropped ten
# correctness tests from every PR. Do not nightly in-process CommandEngine,
# TraceLog lease, or pre-push classification tests.
#
# The interactive REPL PTY check belongs here too: it drives the packaged
# `ptc repl` through expect(1) with timed keystrokes, which is slow and
# load-sensitive, and GitHub Ubuntu does not ship expect. Per-PR
# `core-release` still verifies the package and the rest of the standalone
# smoke; it sets `PTC_SKIP_PTY_GATE`. Docker verify and the packaging script
# keep running the check without that skip.
#
# The launcher OS matrix and the ExDNA candidate probe run here for a different
# reason: neither can block a merge, and both cost more per pull request than
# the signal is worth at 6% and 1% of commits touching them.
#
# Like `soak.yml` this lives outside `test.yml` so it can be dispatched on its
# own and so a red run never blocks an unrelated pull request. The flake hunt
# has its own weekly workflow in `flake-hunt.yml`.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    name: Nightly tests
    # The downstream-consumer test builds a fresh project under MIX_ENV=prod
    # against PtcRunner as a path dependency, so it pays a full cold compile
    # whenever the cached `_build` misses.
    timeout-minutes: 30
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Compile
        run: mix compile --warnings-as-errors

      # `PtcRunner.Kernel.DabstepReviewerRegressionTest` replays a recorded
      # multi-turn run against the real DABStep `payments.csv`. The file is
      # gitignored -- 24MB does not belong in the tree or in the Hex package --
      # so the job has to fetch it, and without it the suite fails on a missing
      # path rather than on anything about this commit.
      #
      # The cache key is the fetch script, which carries the pinned dataset
      # revision and all four checksums: change a pin and the key changes with
      # it. A daily run keeps the entry warm, so the download happens roughly
      # once rather than nightly. `fetch-data.sh` verifies the checksums of
      # whatever is already on disk, so a restored cache is still proven before
      # the suite reads a byte of it.
      - name: Cache the DABStep dataset
        uses: actions/cache@v5
        with:
          path: |
            examples/dabstep-fraud/data
            examples/dabstep-fraud/reference
          key: dabstep-${{ hashFiles('examples/dabstep-fraud/fetch-data.sh') }}

      - name: Fetch and verify the DABStep dataset
        run: ./fetch-data.sh
        working-directory: examples/dabstep-fraud

      - name: Run the nightly test suite
        run: mix nightly

      - name: Check evaluator reduction baselines
        env:
          MIX_ENV: dev
        run: mix bench.check --skip-heap

  interactive-repl:
    runs-on: ubuntu-latest
    name: Interactive REPL
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      # The interactive REPL check drives the packaged command through a
      # pseudo-terminal, which no other gate can supply. macOS ships `expect`;
      # this image does not, and the check refuses to pass by skipping.
      - name: Install the pseudo-terminal driver
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends expect

      - name: Verify the packaged interactive REPL
        run: scripts/verify_standalone_release.sh

  # The launcher OS matrix and its release package. A pull request runs one
  # Linux OS in test.yml; the macOS and arm64 builds are the most expensive
  # jobs in the repository and only 6% of commits touch the launcher, so they
  # run here against main instead.
  launcher-matrix:
    runs-on: ${{ matrix.os }}
    name: MCP stdio launcher companion (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          project-directory: ptc_runner_launcher
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Verify launcher package, process containment, and precompiled fallback
        run: scripts/ci/launcher.sh "$RUNNER_TEMP/launcher-artifacts"

      - name: Retain verified launcher artifact
        uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/launcher-artifacts/*
          if-no-files-found: error

  launcher-package:
    needs: launcher-matrix
    runs-on: ubuntu-latest
    name: MCP stdio launcher release package
    timeout-minutes: 20
    env:
      MIX_ENV: prod
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup launcher packaging environment
        uses: ./.github/actions/setup-elixir
        with:
          project-directory: ptc_runner_launcher
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Collect verified launcher artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: launcher-*
          path: ${{ runner.temp }}/launcher-artifacts
          merge-multiple: true

      - name: Assemble checksums and verify the release package
        working-directory: ptc_runner_launcher
        run: bash scripts/build_release_package.sh "$RUNNER_TEMP/launcher-artifacts"

      - name: Retain verified release package
        uses: actions/upload-artifact@v6
        with:
          name: launcher-release-package
          path: |
            ${{ runner.temp }}/launcher-artifacts/checksum.exs
            ${{ runner.temp }}/launcher-artifacts/ptc_runner_launcher-*.tar
          if-no-files-found: error

  # An upstream-compatibility probe against a pinned unreleased ExDNA commit.
  # It is not in `required.needs` in test.yml, so it never gated a merge, and
  # it re-ran a duplication gate that core-static had already run in the same
  # CI run. A day is the right cadence for an upstream-dependency probe.
  ex-dna-candidate:
    runs-on: ubuntu-latest
    name: ExDNA candidate compatibility
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout PtcRunner
        uses: actions/checkout@v6

      - name: Checkout pinned ExDNA candidate
        uses: actions/checkout@v6
        with:
          repository: andreasronge/ex_dna
          ref: 8fe513647329bff792a3a3d2d20c3810f9e30269
          path: .candidate/ex_dna

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Verify cold and warm duplication gates
        env:
          PTC_EX_DNA_PATH: ${{ github.workspace }}/.candidate/ex_dna
        run: |
          test "$(git -C "$PTC_EX_DNA_PATH" rev-parse HEAD)" = \
            "8fe513647329bff792a3a3d2d20c3810f9e30269"
          mix deps.compile ex_dna --force
          scripts/duplication_gate.sh check
          sha256sum .ex_dna_cache .ex_dna_cache.fingerprints > "$RUNNER_TEMP/ex-dna-cache.before"
          scripts/duplication_gate.sh check
          sha256sum --check "$RUNNER_TEMP/ex-dna-cache.before"
