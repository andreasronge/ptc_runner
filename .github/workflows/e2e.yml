name: Integration Tests

on:
  # Scheduled e2e execution is the rot guard for :e2e-tagged tests, which
  # stay excluded from push/PR pipelines and would otherwise decay silently.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which tests to run'
        required: false
        type: choice
        options:
          - 'e2e'
          - 'integration'
        default: 'e2e'

jobs:
  integration:
    runs-on: ubuntu-latest
    name: Integration Tests
    env:
      MIX_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir

      - name: Compile
        run: mix compile

      - name: Run tagged tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.test_type }}" = "e2e" ]; then
            mix test --include e2e --trace
          else
            mix test --include integration --trace
          fi
        timeout-minutes: 15
