name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The settled-tree probe below lists this workflow's earlier runs.
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Classify changed files
    outputs:
      core: ${{ steps.scopes.outputs.core }}
      launcher: ${{ steps.scopes.outputs.launcher }}
      mcp_http: ${{ steps.scopes.outputs.mcp_http }}
      mcp_filesystem: ${{ steps.scopes.outputs.mcp_filesystem }}
      java: ${{ steps.scopes.outputs.java }}
      viewer: ${{ steps.scopes.outputs.viewer }}
      docs: ${{ steps.scopes.outputs.docs }}
      release: ${{ steps.scopes.outputs.release }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A pull_request run checks out refs/pull/N/merge -- the pull request
      # merged into main as it stood then -- not the pull request head. A squash
      # merge onto that same parent produces a commit carrying exactly that
      # merge's tree, so every gate below would recompute a settled answer.
      # Recompute the merge here rather than trusting `base.sha`, which records
      # the base at the last synchronise, not the commit the squash landed on.
      # A push with no pull request, or a base that moved, still runs in full.
      - name: Detect a tree a green pull-request run already proved
        id: settled
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every probe below tolerates its own failure: an unanswered API call
          # or an unfetchable head leaves `settled` false and runs everything.
          settled=false
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                  --jq '.[0].number // empty' 2>/dev/null || true)"
          head=""
          if [ -n "$pr" ]; then
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
                      --jq .head.sha 2>/dev/null || true)"
          fi

          if [ -n "$head" ]; then
            git fetch --no-tags --depth=50 origin \
              "refs/pull/$pr/head:refs/ptc/settled-head" 2>/dev/null || true

            # `git merge-tree` exits non-zero on a conflicting merge, which is
            # not a tree CI can have tested.
            merged="$(git merge-tree --write-tree \
                        "$GITHUB_SHA^" refs/ptc/settled-head 2>/dev/null || true)"
            # The green run tested the head merged onto main as it stood when
            # the run started, so it proves this push only if the parent was
            # already main's tip then: a parent committed after the run began
            # is a base that moved, and the merge onto it was never tested.
            proven_at="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$head&status=completed&conclusion=success&per_page=1" \
              --jq '.workflow_runs[0].run_started_at // empty' 2>/dev/null || true)"
            parent_at="$(git show -s --format=%cI "$GITHUB_SHA^" 2>/dev/null || true)"

            if [ -n "$merged" ] &&
               [ "$merged" = "$(git rev-parse "$GITHUB_SHA^{tree}")" ] &&
               [ -n "$proven_at" ] && [ -n "$parent_at" ] &&
               [ "$(date -u -d "$parent_at" +%s)" -lt "$(date -u -d "$proven_at" +%s)" ]; then
              settled=true
            fi
          fi

          echo "settled=$settled" >> "$GITHUB_OUTPUT"
          echo "settled tree: $settled"

      - name: Classify changed paths
        id: scopes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SETTLED: ${{ steps.settled.outputs.settled }}
        run: |
          # An empty path list selects every scope through the classifier's
          # fail-safe; inverting that output selects nothing.
          if [ "$SETTLED" = "true" ]; then
            scripts/ci/classify-changes.sh /dev/null \
              | sed 's/=true/=false/' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          paths_file="$(mktemp)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' '.github/workflows/test.yml' > "$paths_file"
          else
            base_sha="$BEFORE_SHA"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base_sha="$BASE_SHA"
            fi

            if [ -z "$base_sha" ] ||
               [ "$base_sha" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              base_sha="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
            fi

            if [ -n "$base_sha" ]; then
              git diff --name-only --no-renames "$base_sha" "$GITHUB_SHA" > "$paths_file"
            else
              git show --pretty=format: --name-only "$GITHUB_SHA" > "$paths_file"
            fi
          fi

          scripts/ci/classify-changes.sh "$paths_file" | tee -a "$GITHUB_OUTPUT"

  # One Linux OS here; the four-OS matrix and the release-package assembly run
  # on Nightly. The macOS pair cost more than any other job in this workflow
  # and 76% of their firings came from the `mix.lock` fan-out, not from a
  # launcher change. The packaging contract and process containment still gate
  # every pull request through this job.
  mcp-stdio-launcher:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-22.04
    name: MCP stdio launcher companion
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          project-directory: ptc_runner_launcher
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Verify launcher package, process containment, and precompiled fallback
        run: scripts/ci/launcher.sh "$RUNNER_TEMP/launcher-artifacts"

  mcp-http-interop:
    needs: changes
    if: needs.changes.outputs.mcp_http == 'true'
    runs-on: ubuntu-latest
    name: MCP stateless HTTP interoperability
    env:
      MIX_ENV: test
      HEX_SPONSOR: false
      PTC_TEST_MCP_2026_ENDPOINT: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Setup pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: test/support/mcp_go_stateless/go.mod
          cache-dependency-path: test/support/mcp_go_stateless/go.sum

      - name: Verify stateless HTTP interoperability
        run: |
          bash test/support/mcp_go_stateless/with_server.sh \
            mix test test/ptc_runner/kernel/mcp_remote_e2e_test.exs \
              --include e2e --trace --warnings-as-errors
          PTC_TEST_MCP_OAUTH=1 PTC_TEST_MCP_TLS=1 \
            bash test/support/mcp_go_stateless/with_server.sh \
              mix test test/ptc_runner/kernel/mcp_oauth_remote_e2e_test.exs \
                --include e2e --trace --warnings-as-errors

  mcp-filesystem-e2e:
    needs: changes
    if: needs.changes.outputs.mcp_filesystem == 'true'
    runs-on: ubuntu-latest
    name: MCP filesystem e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Setup pinned Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'

      - name: Verify host JSON, manifest, stdio, and PTC-Lisp integration
        run: |
          mix test test/ptc_runner/kernel/filesystem_mcp_e2e_test.exs \
            test/ptc_runner/kernel/named_missions_authority_e2e_test.exs \
            test/ptc_runner/kernel/ptc_fs_mcp_stdio_test.exs \
            --include e2e --trace --warnings-as-errors

  # `Core validation` used to be one job running tests, Dialyzer, release
  # verification, and the lint/staleness checks in series: 438 s, and the whole
  # CI critical path, because every other job finishes in under two minutes.
  # These four concerns share no state, so they are four jobs. Nothing is
  # dropped -- the same commands run, and `required` still demands all of them.
  #
  # The cost is one Elixir setup per job instead of one for all four. That is
  # billed minutes, not wall clock, and the split is worth roughly 4-5x the
  # setup it adds.
  #
  # `cache-plt` is requested only by the Dialyzer job: the PLT is useless to
  # the others and restoring it would put a cache download on their path.
  core-test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Core tests
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # No Java or Babashka here: every test that shells out to a JVM or to
      # `bb` is tagged `:clojure` and excluded from `mix test` by default, so
      # installing them would only slow the critical path down.
      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      # No `--trace` here, and none may be reintroduced: it sets `--max-cases`
      # to 1 (`Mix.Tasks.Test` docs; `ExUnit.max_cases/1`), which ran this
      # suite single-threaded on a 4-vCPU runner for 259 s. `--slowest` and
      # `--slowest-modules` imply `--trace` too, so they are not a substitute
      # for the per-test timings this drops; get those from a local run or the
      # `Nightly` workflow.
      #
      # Dropping `--trace` also restores the default 60 s per-test timeout,
      # which trace mode had set to `:infinity`. That is what the `:nightly`
      # exclusion in `test/test_helper.exs` pairs with: the slowest remaining
      # Mix-subprocess test takes 61.1 s and would otherwise time out here.
      # `:nightly` is for operator-path Mix/OS subprocesses and intentional
      # multi-second waits -- not for in-process correctness tests.
      - name: Compile and run tests
        run: scripts/ci/core-tests.sh

  core-static:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Core static analysis
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # `mix ptc.audit_upstream` reports SKIP and passes when it cannot find a
      # `java` or a `bb`/`clojure`/`clj` executable -- it does not fail. Both
      # toolchains must therefore stay on whichever job runs it, or the audit
      # silently degrades into a no-op that still shows green.
      - name: Setup Java environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'

      # `scripts/ci/gateway.sh` compiles ptc_gateway, which carries ptc_runner
      # as a path dependency. The setup action caches only the project
      # directory it is given, so without this the nested project cold-compiles
      # the whole library on every run -- 70 s of the 94 s the gateway gate
      # spends. Both lockfiles are in the key, so a restored build cannot drift
      # past its dependencies.
      - name: Cache the gateway build
        uses: actions/cache@v5
        with:
          path: |
            ptc_gateway/deps
            ptc_gateway/_build
            ptc_gateway/test/support/mcp_conformance/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-gateway-envtest-${{ hashFiles('mix.lock', 'ptc_gateway/mix.lock', 'ptc_gateway/test/support/mcp_conformance/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gateway-envtest-

      - name: Run static analysis and generated-artifact checks
        run: scripts/ci/core-static.sh

  # Measured on CI: the PLT cache restores in 0.2 s, then 94 s goes on removing
  # the 465 project modules baked into the cached PLT and adding this commit's
  # 479, and 27 s on the analysis itself. Caching only the core PLT and
  # rebuilding `project.plt` each run may be cheaper, but the rebuild has not
  # been measured, so the change is deliberately not made here.
  core-dialyzer:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Core Dialyzer
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          install-babashka: 'false'

      - name: Dialyzer
        run: scripts/ci/core-dialyzer.sh

  core-release:
    needs: changes
    # Unconditional on a push to main and on a manual run; on a pull request
    # only when a packaging input moved, or when the author labels the pull
    # request `release`. This job builds two production trees from cold and is
    # the second most expensive in the workflow, and a pure `lib/` change
    # cannot alter what it verifies without `core-test` catching it first.
    if: >-
      needs.changes.outputs.core == 'true' &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.release == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    name: Core release verification
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      # The setup action's cache key carries MIX_ENV and this job runs as
      # `test`, so `_build/prod` is cold every run and the standalone release
      # recompiles every dependency. The package gate's own prod build happens
      # inside the extracted tarball under $TMPDIR and stays cold on purpose --
      # that build is the thing under test.
      - name: Cache the production build
        uses: actions/cache@v5
        with:
          path: _build/prod
          key: ${{ runner.os }}-${{ runner.arch }}-mix-.-envprod-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-.-envprod-

      # core-release.sh skips the interactive PTY REPL; that check lives on
      # Nightly because it needs a real terminal and timed keystrokes.
      - name: Verify release packages
        run: scripts/ci/core-release.sh

  java-interop-conformance:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    name: Java interop conformance
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pinned Java oracle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'

      - name: Cache pinned JVM Clojure
        uses: actions/cache@v5
        with:
          path: _build/tools/jvm_clojure
          key: jvm-clojure-${{ runner.os }}-1.12.5-sha256-v1

      - name: Install pinned JVM Clojure
        run: mix ptc.install_clojure

      - name: Verify authoritative JVM fixtures
        run: |
          mix ptc.java_conformance --oracle jvm --subset implemented
          mix ptc.java_fixtures --oracle jvm --check

      - name: Verify Babashka fast subset
        run: mix ptc.java_conformance --oracle babashka --subset fast

      - name: Verify closed-dispatch Java compatibility cases
        run: mix ptc.java_conformance --oracle ptc --subset closed-dispatch

  viewer:
    needs: changes
    if: needs.changes.outputs.viewer == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Viewer validation
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Viewer Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          project-directory: ptc_viewer
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Compile and test Viewer
        run: scripts/ci/viewer.sh

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Documentation validation
    env:
      MIX_ENV: dev
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup documentation environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Build documentation
        run: scripts/ci/docs.sh

  required:
    if: always()
    needs:
      - changes
      - core-test
      - core-static
      - core-dialyzer
      - core-release
      - viewer
      - docs
      - mcp-stdio-launcher
      - mcp-http-interop
      - mcp-filesystem-e2e
      - java-interop-conformance
    runs-on: ubuntu-latest
    name: Required CI result

    steps:
      - name: Require every selected job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(
              .[];
              .result == "success" or .result == "skipped"
            )
          ' <<< "$JOB_RESULTS"
