name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Classify changed files
    outputs:
      core: ${{ steps.scopes.outputs.core }}
      launcher: ${{ steps.scopes.outputs.launcher }}
      mcp_http: ${{ steps.scopes.outputs.mcp_http }}
      mcp_filesystem: ${{ steps.scopes.outputs.mcp_filesystem }}
      java: ${{ steps.scopes.outputs.java }}
      viewer: ${{ steps.scopes.outputs.viewer }}
      docs: ${{ steps.scopes.outputs.docs }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scopes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          paths_file="$(mktemp)"

          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' '.github/workflows/test.yml' > "$paths_file"
          else
            base_sha="$BEFORE_SHA"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base_sha="$BASE_SHA"
            fi

            if [ -z "$base_sha" ] ||
               [ "$base_sha" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              base_sha="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
            fi

            if [ -n "$base_sha" ]; then
              git diff --name-only --no-renames "$base_sha" "$GITHUB_SHA" > "$paths_file"
            else
              git show --pretty=format: --name-only "$GITHUB_SHA" > "$paths_file"
            fi
          fi

          scripts/ci/classify-changes.sh "$paths_file" | tee -a "$GITHUB_OUTPUT"

  mcp-stdio-launcher:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ${{ matrix.os }}
    name: MCP stdio launcher companion (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          project-directory: ptc_runner_launcher
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Verify launcher package, process containment, and precompiled fallback
        run: scripts/ci/launcher.sh "$RUNNER_TEMP/launcher-artifacts"

      - name: Retain verified launcher artifact
        uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/launcher-artifacts/*
          if-no-files-found: error

  mcp-stdio-launcher-package:
    needs: [changes, mcp-stdio-launcher]
    if: needs.changes.outputs.launcher == 'true' && needs.mcp-stdio-launcher.result == 'success'
    runs-on: ubuntu-latest
    name: MCP stdio launcher release package
    env:
      MIX_ENV: prod
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup launcher packaging environment
        uses: ./.github/actions/setup-elixir
        with:
          project-directory: ptc_runner_launcher
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Collect verified launcher artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: launcher-*
          path: ${{ runner.temp }}/launcher-artifacts
          merge-multiple: true

      - name: Assemble checksums and verify the release package
        working-directory: ptc_runner_launcher
        run: bash scripts/build_release_package.sh "$RUNNER_TEMP/launcher-artifacts"

      - name: Retain verified release package
        uses: actions/upload-artifact@v6
        with:
          name: launcher-release-package
          path: |
            ${{ runner.temp }}/launcher-artifacts/checksum.exs
            ${{ runner.temp }}/launcher-artifacts/ptc_runner_launcher-*.tar
          if-no-files-found: error

  mcp-http-interop:
    needs: changes
    if: needs.changes.outputs.mcp_http == 'true'
    runs-on: ubuntu-latest
    name: MCP stateless HTTP interoperability
    env:
      MIX_ENV: test
      HEX_SPONSOR: false
      PTC_TEST_MCP_2026_ENDPOINT: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Setup pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: test/support/mcp_go_stateless/go.mod
          cache-dependency-path: test/support/mcp_go_stateless/go.sum

      - name: Verify stateless HTTP interoperability
        run: |
          bash test/support/mcp_go_stateless/with_server.sh \
            mix test test/ptc_runner/kernel/mcp_remote_e2e_test.exs \
              --include e2e --trace --warnings-as-errors
          PTC_TEST_MCP_OAUTH=1 PTC_TEST_MCP_TLS=1 \
            bash test/support/mcp_go_stateless/with_server.sh \
              mix test test/ptc_runner/kernel/mcp_oauth_remote_e2e_test.exs \
                --include e2e --trace --warnings-as-errors

  mcp-filesystem-sample:
    needs: changes
    if: needs.changes.outputs.mcp_filesystem == 'true'
    runs-on: ubuntu-latest
    name: MCP filesystem sample server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Setup pinned Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: examples/mcp/filesystem/package-lock.json

      # `npm ci` installs the lockfile exactly and fails when package.json and
      # the lockfile disagree, so a hand-edited dependency cannot reach CI.
      - name: Install pinned dependencies
        working-directory: examples/mcp/filesystem
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: examples/mcp/filesystem
        run: npm run typecheck

      # The bundle is committed so a clean checkout can run the server without
      # installing anything. Regenerate it and fail on any difference, so the
      # artifact can never drift from the source that supposedly produced it.
      - name: Rebuild the committed bundle
        working-directory: examples/mcp/filesystem
        run: npm run build

      - name: Fail if the committed bundle is stale
        working-directory: examples/mcp/filesystem
        run: |
          if ! git diff --exit-code -- dist/server.js; then
            echo "::error::dist/server.js does not match a rebuild from src/. Run 'npm run build' in examples/mcp/filesystem and commit the result." >&2
            exit 1
          fi

      - name: Run server conformance tests
        working-directory: examples/mcp/filesystem
        run: npm test

      - name: Verify host JSON, manifest, stdio, and PTC-Lisp integration
        run: |
          mix test test/ptc_runner/kernel/filesystem_mcp_e2e_test.exs \
            --include e2e --trace --warnings-as-errors

  # `Core validation` used to be one job running tests, Dialyzer, release
  # verification, and the lint/staleness checks in series: 438 s, and the whole
  # CI critical path, because every other job finishes in under two minutes.
  # These four concerns share no state, so they are four jobs. Nothing is
  # dropped -- the same commands run, and `required` still demands all of them.
  #
  # The cost is one Elixir setup per job instead of one for all four. That is
  # billed minutes, not wall clock, and the split is worth roughly 4-5x the
  # setup it adds.
  #
  # `cache-plt` is requested only by the Dialyzer job: the PLT is useless to
  # the others and restoring it would put a cache download on their path.
  core-test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Core tests
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # No Java or Babashka here: every test that shells out to a JVM or to
      # `bb` is tagged `:clojure` and excluded from `mix test` by default, so
      # installing them would only slow the critical path down.
      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      # No `--trace` here, and none may be reintroduced: it sets `--max-cases`
      # to 1 (`Mix.Tasks.Test` docs; `ExUnit.max_cases/1`), which ran this
      # suite single-threaded on a 4-vCPU runner for 259 s. `--slowest` and
      # `--slowest-modules` imply `--trace` too, so they are not a substitute
      # for the per-test timings this drops; get those from a local run or the
      # `Nightly` workflow.
      #
      # Dropping `--trace` also restores the default 60 s per-test timeout,
      # which trace mode had set to `:infinity`. That is what the `:nightly`
      # exclusion in `test/test_helper.exs` pairs with: the slowest test takes
      # 61.1 s and would otherwise time out here. `:nightly` is a narrow tag --
      # do not reach for it to make this step faster, because every test it
      # covers stops being verified on pull requests.
      - name: Compile and run tests
        run: scripts/ci/core-tests.sh

  core-static:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Core static analysis
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # `mix ptc.audit_upstream` reports SKIP and passes when it cannot find a
      # `java` or a `bb`/`clojure`/`clj` executable -- it does not fail. Both
      # toolchains must therefore stay on whichever job runs it, or the audit
      # silently degrades into a no-op that still shows green.
      - name: Setup Java environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'

      - name: Run static analysis and generated-artifact checks
        run: scripts/ci/core-static.sh

  core-dialyzer:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Core Dialyzer
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          install-babashka: 'false'

      - name: Dialyzer
        run: scripts/ci/core-dialyzer.sh

  core-release:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Core release verification
    timeout-minutes: 20
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      # The interactive REPL check drives the packaged command through a
      # pseudo-terminal, which no other gate can supply. macOS ships `expect`;
      # this image does not, and the check refuses to pass by skipping.
      - name: Install the pseudo-terminal driver
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends expect

      - name: Verify release packages
        run: scripts/ci/core-release.sh

  ex-dna-candidate:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: ExDNA candidate compatibility
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout PtcRunner
        uses: actions/checkout@v6

      - name: Checkout pinned ExDNA candidate
        uses: actions/checkout@v6
        with:
          repository: andreasronge/ex_dna
          ref: 8fe513647329bff792a3a3d2d20c3810f9e30269
          path: .candidate/ex_dna

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Verify cold and warm duplication gates
        env:
          PTC_EX_DNA_PATH: ${{ github.workspace }}/.candidate/ex_dna
        run: |
          test "$(git -C "$PTC_EX_DNA_PATH" rev-parse HEAD)" = \
            "8fe513647329bff792a3a3d2d20c3810f9e30269"
          mix deps.compile ex_dna --force
          scripts/duplication_gate.sh check
          sha256sum .ex_dna_cache .ex_dna_cache.fingerprints > "$RUNNER_TEMP/ex-dna-cache.before"
          scripts/duplication_gate.sh check
          sha256sum --check "$RUNNER_TEMP/ex-dna-cache.before"

  java-interop-conformance:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    name: Java interop conformance
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pinned Java oracle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir

      - name: Cache pinned JVM Clojure
        uses: actions/cache@v5
        with:
          path: _build/tools/jvm_clojure
          key: jvm-clojure-${{ runner.os }}-1.12.5-sha256-v1

      - name: Install pinned JVM Clojure
        run: mix ptc.install_clojure

      - name: Verify authoritative JVM fixtures
        run: |
          mix ptc.java_conformance --oracle jvm --subset implemented
          mix ptc.java_fixtures --oracle jvm --check

      - name: Verify Babashka fast subset
        run: mix ptc.java_conformance --oracle babashka --subset fast

      - name: Verify closed-dispatch Java compatibility cases
        run: mix ptc.java_conformance --oracle ptc --subset closed-dispatch

  viewer:
    needs: changes
    if: needs.changes.outputs.viewer == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Viewer validation
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Viewer Elixir environment
        uses: ./.github/actions/setup-elixir
        with:
          project-directory: ptc_viewer
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Compile and test Viewer
        run: scripts/ci/viewer.sh

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    name: Documentation validation
    env:
      MIX_ENV: dev
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup documentation environment
        uses: ./.github/actions/setup-elixir
        with:
          cache-plt: 'false'
          install-babashka: 'false'

      - name: Build documentation
        run: scripts/ci/docs.sh

  required:
    if: always()
    needs:
      - changes
      - core-test
      - core-static
      - core-dialyzer
      - core-release
      - viewer
      - docs
      - mcp-stdio-launcher
      - mcp-stdio-launcher-package
      - mcp-http-interop
      - mcp-filesystem-sample
      - java-interop-conformance
    runs-on: ubuntu-latest
    name: Required CI result

    steps:
      - name: Require every selected job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(
              .[];
              .result == "success" or .result == "skipped"
            )
          ' <<< "$JOB_RESULTS"
