name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Compile, test, format, credo, dialyzer & deps check
    env:
      MIX_ENV: test
      HEX_SPONSOR: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Elixir environment
        uses: ./.github/actions/setup-elixir

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --max-failures 1 --trace --warnings-as-errors

      - name: Check code is formatted
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Check generated Java documentation and conformance inventory
        run: |
          mix ptc.gen_docs --check
          mix ptc.conformance_report --check-inventory

      - name: Audit upstream compatibility metadata
        run: mix ptc.audit_upstream

      - name: Dialyzer
        run: mix dialyzer --format github

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Build documentation
        run: MIX_ENV=dev mix deps.get && MIX_ENV=dev mix docs --warnings-as-errors
